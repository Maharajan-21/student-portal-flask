<!DOCTYPE html>
<html>
<head>
    <title>Student Rank List</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🏆 Student Rank List</h1>

<table>

<tr>
    <th>Rank</th>
    <th>Name</th>
    <th>Department</th>
    <th>CGPA</th>
</tr>

{% for student in students %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ student[1] }}</td>

<td>{{ student[2] }}</td>

<td>{{ student[6] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
