<!DOCTYPE html>
<html>
<head>
    <title>Search Student</title>
</head>
<body>

<h1>Search Student</h1>

<form method="POST">

    <label>Student ID</label><br>
    <input type="number" name="student_id"><br><br>

    <button type="submit">Search</button>

</form>

{% if student %}

<h2>Student Details</h2>

<p><b>ID :</b> {{ student[0] }}</p>
<p><b>Name :</b> {{ student[1] }}</p>
<p><b>Department :</b> {{ student[2] }}</p>
<p><b>Marks :</b> {{ student[4] }}</p>
<p><b>Attendance :</b> {{ student[5] }}%</p>
<p><b>CGPA :</b> {{ student[6] }}</p>

{% endif %}

</body>
</html>
