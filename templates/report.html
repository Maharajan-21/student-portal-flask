<!DOCTYPE html>
<html>
<head>
    <title>Student Report Card</title>
</head>
<body>

<h1>🎓 Student Report Card</h1>

<hr>

<p><b>Student ID :</b> {{ student[0] }}</p>
<p><b>Name :</b> {{ student[1] }}</p>
<p><b>Department :</b> {{ student[2] }}</p>
<p><b>Marks :</b> {{ student[4] }}</p>
<p><b>Attendance :</b> {{ student[5] }}%</p>
<p><b>CGPA :</b> {{ student[6] }}</p>

{% if student[4] >= 50 %}
    <h2 style="color:green;">✅ PASS</h2>
{% else %}
    <h2 style="color:red;">❌ FAIL</h2>
{% endif %}

<a href="{{ url_for('download_report') }}">
    <button>📄 Download PDF</button>
</a>

</body>
</html>
