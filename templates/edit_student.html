<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h1>Edit Student</h1>

<form method="POST">

    <label>Name</label><br>
    <input type="text" name="name" value="{{ student[1] }}"><br><br>

    <label>Department</label><br>
    <input type="text" name="department" value="{{ student[2] }}"><br><br>

    <label>Marks</label><br>
    <input type="number" name="marks" value="{{ student[4] }}"><br><br>

    <label>Attendance</label><br>
    <input type="number" name="attendance" value="{{ student[5] }}"><br><br>

    <label>CGPA</label><br>
    <input type="number" step="0.1" name="cgpa" value="{{ student[6] }}"><br><br>

    <button type="submit">Update Student</button>

</form>

</body>
</html>
