<!DOCTYPE html>
<html>
<head>
    <title>All Students</title>
</head>
<body>

<h1>All Students</h1>

<table border="1">

    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Marks</th>
        <th>Attendance</th>
        <th>CGPA</th>
        <th>Action</th>
    </tr>

    {% for student in students %}

    <tr>
        <td>{{ student[0] }}</td>
        <td>{{ student[1] }}</td>
        <td>{{ student[2] }}</td>
        <td>{{ student[4] }}</td>
        <td>{{ student[5] }}%</td>
        <td>{{ student[6] }}</td>
        <td>
    <a href="{{ url_for('edit_student', student_id=student[0]) }}">
        Edit
    </a>

    |

    <a href="{{ url_for('delete', student_id=student[0]) }}">
        Delete
    </a>
</td>
    </tr>


    {% endfor %}

</table>

</body>
</html>
